<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>Sobre Danilo Texeira — apresentação em estilo HTML</title><rect x="1" y="1" width="1098" height="648" rx="14" fill="#030a06" stroke="#174822"/><path d="M1 58h1098" stroke="#174822"/><circle cx="30" cy="29" r="5" fill="#32e64f"/><text x="48" y="35" font-family="Consolas,monospace" font-size="17" fill="#a4b5a8">sobre.html</text><text x="1065" y="35" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#32e64f">&lt;/&gt;</text><text x="38" y="99" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;section id=&quot;sobre&quot;&gt;</text><text x="60" y="131" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;p&gt;</text><text x="86" y="163" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">Sou Danilo Texeira, desenvolvedor web em início de carreira, com foco em</text><text x="86" y="195" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">front-end júnior. No Descomplica Dev Dan, reúno projetos, experimentos e o</text><text x="86" y="227" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">que aprendo ao conectar pessoas, processos e código.</text><text x="60" y="259" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;/p&gt;</text><text x="60" y="291" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;p&gt;</text><text x="86" y="323" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">Minha experiência freelance inclui a Nutricomp, um cardápio digital com</text><text x="86" y="355" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">montagem de pedidos. Minha bagagem administrativa e operacional contribui</text><text x="86" y="387" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">para a organização, a comunicação e a atenção às necessidades de quem</text><text x="86" y="419" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">utiliza uma aplicação.</text><text x="60" y="451" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;/p&gt;</text><text x="60" y="483" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;footer&gt;</text><text x="86" y="515" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">São Paulo/SP · Remoto, híbrido e presencial. Oportunidades júnior e projetos</text><text x="86" y="547" font-family="Consolas,monospace" font-size="21" fill="#e6eee8">freelance.</text><text x="60" y="579" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;/footer&gt;</text><text x="38" y="611" font-family="Consolas,monospace" font-size="21" fill="#32e64f">&lt;/section&gt;</text></svg>