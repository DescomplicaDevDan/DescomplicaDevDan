name: Atualizar indicadores do perfil

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_insights.py
      - .github/workflows/insights.yml

permissions:
  contents: write

concurrency:
  group: profile-insights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar GitHub e gerar indicadores
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_insights.py
      - name: Publicar atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md github-insights.svg github-insights.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualizar indicadores do GitHub"
            git push
          fi
